<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイト分析レポート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16202B; --muted:#6B7684; --faint:#9AA4B0;
    --bg:#F5F7FA; --surface:#FFFFFF; --hair:#E4E8EE; --hair-strong:#D3DAE3;
    --accent:#2857D6; --accent-soft:#EAF0FF;
    --up:#16A34A; --down:#DC2626;
    --shadow:0 1px 2px rgba(22,32,43,.04), 0 8px 24px rgba(22,32,43,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Inter","Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1;
  }
  .wrap{max-width:1000px; margin:0 auto; padding:28px 22px 72px}
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}

  /* masthead */
  .masthead{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 24px; padding-bottom:18px; border-bottom:1px solid var(--hair-strong)}
  .masthead h1{font-size:24px; font-weight:700; margin:0}
  .subline{margin-top:6px; color:var(--muted); font-size:13px}
  .subline b{color:var(--ink); font-weight:600}
  .controls{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
  .presets{display:inline-flex; background:var(--surface); border:1px solid var(--hair-strong); border-radius:10px; overflow:hidden}
  .presets button{appearance:none; border:0; background:transparent; padding:8px 12px; font:inherit; font-size:13px; color:var(--muted); cursor:pointer; border-left:1px solid var(--hair)}
  .presets button:first-child{border-left:0}
  .presets button[aria-pressed="true"]{background:var(--accent); color:#fff; font-weight:600}
  .dates{display:inline-flex; align-items:center; gap:6px}
  .dates input{font:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--hair-strong); border-radius:9px; background:var(--surface); color:var(--ink)}
  .dates span{color:var(--faint)}
  .btn{appearance:none; font:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:8px 14px; border-radius:9px; border:1px solid var(--accent); background:var(--accent); color:#fff}
  .btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--hair-strong)}
  .btn:disabled{opacity:.5; cursor:default}
  .settings{margin-top:12px; flex-basis:100%}
  .settings summary{cursor:pointer; color:var(--muted); font-size:12.5px; width:max-content}
  .settings .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px}
  .settings label{font-size:12.5px; color:var(--muted)}
  .settings input{font:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--hair-strong); border-radius:9px; min-width:180px}

  .panel{background:var(--surface); border:1px solid var(--hair); border-radius:14px; box-shadow:var(--shadow)}

  /* summary */
  .summary{margin-top:22px; border-top:3px solid var(--accent); overflow:hidden}
  .summary-grid{display:grid; grid-template-columns:repeat(3,1fr)}
  .cell{padding:18px 20px; border-left:1px solid var(--hair)}
  .cell:first-child{border-left:0}
  .cell .label{font-size:12.5px; color:var(--muted); font-weight:500}
  .cell .value{font-size:30px; font-weight:700; margin-top:8px}
  .delta{display:inline-flex; align-items:center; gap:4px; margin-top:8px; font-size:12.5px; font-weight:600}
  .delta .prev{color:var(--faint); font-weight:400; margin-left:6px}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--muted)}

  /* section head */
  .section-head{margin:34px 2px 12px}
  .section-head h2{font-size:16px; font-weight:700; margin:0}
  .section-head p{font-size:12.5px; color:var(--muted); margin:5px 0 0}

  /* channel bars */
  .chan{padding:8px 20px 16px}
  .chan-row{display:grid; grid-template-columns:150px 1fr 120px; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--hair)}
  .chan-row:last-child{border-bottom:0}
  .chan-name{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:500}
  .dot{width:10px; height:10px; border-radius:3px; flex:0 0 auto}
  .chan-bar{height:10px; background:#F0F3F7; border-radius:5px; overflow:hidden}
  .chan-bar i{display:block; height:100%; border-radius:5px}
  .chan-val{text-align:right; font-size:13.5px}
  .chan-val b{font-weight:700}
  .chan-val em{font-style:normal; color:var(--faint); font-size:12px; margin-left:5px}
  .chan-val .delta{margin:2px 0 0; justify-content:flex-end; font-size:11.5px}
  .note{font-size:11.5px; color:var(--faint); padding:2px 20px 16px; line-height:1.6}

  /* pages */
  .legend{display:flex; flex-wrap:wrap; gap:14px; margin:2px 2px 14px}
  .legend span{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
  .page-item{padding:16px 20px; border-bottom:1px solid var(--hair)}
  .page-item:last-child{border-bottom:0}
  .page-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .page-name{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .page-path{color:var(--faint); font-size:11px; font-weight:400; margin-left:8px}
  .page-metrics{white-space:nowrap; text-align:right}
  .page-metrics b{font-size:16px; font-weight:700}
  .page-metrics .unit{font-size:11.5px; color:var(--muted); margin-left:3px}
  .page-metrics .delta{display:inline-flex; margin:0 0 0 10px; font-size:11.5px}
  .stack{display:flex; height:12px; border-radius:6px; overflow:hidden; margin:12px 0 10px; background:#F0F3F7}
  .stack i{height:100%}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink); background:#F5F7FA; border:1px solid var(--hair); border-radius:20px; padding:3px 10px}
  .chip .num{font-weight:700}

  /* page picker + detail */
  .picker{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:16px 20px}
  .picker label{font-size:13px; color:var(--muted)}
  .picker select{font:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--hair-strong); border-radius:9px; background:var(--surface); color:var(--ink); min-width:260px; max-width:100%}
  .detail{border-top:1px solid var(--hair); padding:18px 20px 22px}
  .detail-title{font-size:15px; font-weight:700; margin:0}
  .detail-title .page-path{color:var(--faint); font-size:11px; font-weight:400; margin-left:8px}
  .detail-kpi{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:16px 0 6px}
  .detail-kpi .k{border:1px solid var(--hair); border-radius:11px; padding:12px 14px}
  .detail-kpi .k .label{font-size:12px; color:var(--muted)}
  .detail-kpi .k .value{font-size:24px; font-weight:700; margin-top:5px}
  .detail-kpi .k .delta{margin-top:6px; font-size:11.5px}
  .detail-sub{font-size:12.5px; color:var(--muted); font-weight:600; margin:22px 0 8px}
  .trend{width:100%; height:auto; display:block; margin:4px 0 2px}
  .trend-single{font-size:28px; font-weight:700; padding:14px 0}
  .detail-hint{padding:20px; color:var(--faint); font-size:13px}
  .detail-loading{padding:20px; display:flex; align-items:center; gap:12px; color:var(--muted); font-size:13.5px}

  /* states */
  #state{margin-top:22px}
  .msg{padding:26px 22px; border-radius:14px; border:1px solid var(--hair); background:var(--surface); color:var(--muted); font-size:14px; line-height:1.7}
  .msg.err{border-color:#F3C9C9; background:#FDF3F3; color:#9A2B2B}
  .msg b{color:var(--ink)}
  .msg.err b{color:#7A1F1F}
  .msg code{background:#EEF1F5; padding:1px 6px; border-radius:5px; font-size:12.5px}
  .loading{display:flex; align-items:center; gap:12px}
  .spin{width:18px; height:18px; border:2px solid var(--hair-strong); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none !important}
  .updated{color:var(--faint); font-size:12px; margin-top:16px; text-align:right}

  @media (max-width:720px){
    .summary-grid{grid-template-columns:1fr}
    .cell{border-left:0; border-top:1px solid var(--hair)}
    .cell:first-child{border-top:0}
    .chan-row{grid-template-columns:110px 1fr 96px; gap:8px}
  }
  @media print{
    body{background:#fff}
    .controls,.settings,.btn,.section-head p{display:none !important}
    .wrap{max-width:none; padding:0}
    .panel{box-shadow:none; break-inside:avoid}
    .page-item{break-inside:avoid}
    @page{margin:14mm}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <h1>サイト分析レポート</h1>
      <div class="subline" id="subline">対象・期間を読み込み中…</div>
    </div>
    <div class="controls">
      <div class="presets" id="presets" role="group" aria-label="期間">
        <button data-days="1">過去1日</button>
        <button data-days="7">過去7日</button>
        <button data-days="28" aria-pressed="true">過去28日</button>
        <button data-days="90">過去90日</button>
      </div>
      <div class="dates">
        <input type="date" id="start" aria-label="開始日">
        <span>–</span>
        <input type="date" id="end" aria-label="終了日">
      </div>
      <button class="btn" id="run">更新</button>
      <button class="btn ghost" id="print">PDF出力</button>
    </div>
    <details class="settings">
      <summary>設定（プロパティID・レポート名）</summary>
      <div class="row">
        <label>GA4 プロパティID <input type="text" id="propId" inputmode="numeric" placeholder="例：123456789"></label>
        <label>レポート名称 <input type="text" id="propLabel" placeholder="例：エース体操クラブ 南丘校"></label>
      </div>
    </details>
  </header>

  <div id="state"></div>

  <main id="report" class="hidden">
    <!-- サマリー -->
    <section class="panel summary">
      <div class="summary-grid" id="summaryGrid"></div>
    </section>

    <!-- どこから来たか -->
    <div class="section-head">
      <h2>どこから来たか</h2>
      <p>サイトを訪れた人が、どの入口から来たかの内訳です（訪問数）。</p>
    </div>
    <section class="panel">
      <div class="chan" id="chanList"></div>
      <div class="note" id="chanNote"></div>
    </section>

    <!-- ページを選んで詳しく見る -->
    <div class="section-head">
      <h2>ページを選んで詳しく見る</h2>
      <p>ページを選ぶと、そのページの閲覧数の推移と、入口の内訳を表示します。</p>
    </div>
    <section class="panel">
      <div class="picker">
        <label for="pageSelect">ページ</label>
        <select id="pageSelect"><option value="">— ページを選択 —</option></select>
      </div>
      <div id="pageDetailHint" class="detail-hint">上のプルダウンからページを選んでください。</div>
      <div id="pageDetail"></div>
    </section>

    <!-- ページ別 -->
    <div class="section-head">
      <h2>よく見られたページ</h2>
      <p>閲覧の多いページと、そのページを見た人がどの入口から来たかの内訳です（ページ閲覧数）。</p>
    </div>
    <div class="legend" id="legend"></div>
    <section class="panel" id="pageList"></section>

    <div class="updated" id="updated"></div>
  </main>
</div>

<script>
/* ============================================================
   1) CONFIG — 自分の環境に合わせて書き換える
   ============================================================ */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxb2Fga6SUdTq7FKxv59X6M5vCwSHB7yj55fQ9wPKv9K1jOmDg3n4WhL8fSKUilQvO9Pw/exec', // GAS ウェブアプリの /exec URL
  DEFAULT_PROPERTY_ID: '425610888',                    // 既定の GA4 プロパティID（GAS 側で設定するなら空でOK）
  PROPERTY_LABEL: 'ACEサイト分析'                          // レポート見出しの名称（空なら自動）
};

/* ============================================================
   2) 入口（流入元）の分類ルール — 上から順に最初に一致したものを採用
      入口が増えたら test を1行足すだけ。source / medium は小文字で判定。
   ============================================================ */
const SOURCE_RULES = [
  { key:'line',    label:'LINE・直接アクセス', color:'#2857D6',
    test:(s,m)=> s==='(direct)' || s.includes('line') },
  { key:'site',    label:'公式HP',          color:'#0F9E8E',
    test:(s,m)=> s.includes('ace-gym.net') },
  { key:'app',     label:'hacomono', color:'#E8912D',
    test:(s,m)=> s.includes('hacomono') },
  { key:'search',  label:'検索（Google・Yahoo!）', color:'#8B5CF6',
    test:(s,m)=> m==='organic' },
  { key:'sns',     label:'SNS',                 color:'#E15B97',
    test:(s,m)=> m==='social' || /instagram|facebook|fb\.|t\.co|twitter|x\.com/.test(s) }
];
const SOURCE_FALLBACK = { key:'other', label:'その他', color:'#9AA4B0' };

/* ============================================================
   3) ページ名の対応表（任意）— URLパス → 社長向けの名前
      登録すると一覧がその名前で表示される。未登録はページタイトル/パスを表示。
      例：
      '/':            'トップページ',
      '/lesson':      'レッスン案内',
      '/price':       '料金・月謝',
   ============================================================ */
const PAGE_LABELS = {
  '/view/ace-next/':            'エース（体操・ラボ）',
  '/view/ace-next':             'エース（体操・ラボ）',
  '/view/ace-next/calendar':    'カレンダー・時間割',
  '/view/ace-next/kinder':      'はじめのいっぽ',
  '/view/ace-next/School-Care': 'にじいろ学舎',
  '/view/ace-next/event':       '新規入会募集',
  '/view/ace-next/camp':        '短期教室',
  '/view/ace-next/mamatr':      'ママトレ',
  '/view/ace-next/minamioka':   '南丘校',
  '/view/ace-next/sc':          '時間割（詳細）',
  '/view/ace-next/cl':          'カレンダー（詳細）',
  '/view/ace-next/inst':        '会員マイページ操作説明',
  '/view/ace-next/instLABO':    'LABO会員マイページ操作説明',
  '/view/ace-next/procedure':   '各種お手続き',
  '/view/ace-next/continue':    '継続届',
  '/view/ace-next/labo/LABO-about': 'LABOについて',
   '/view/ace-next/labo': 'LABOメイン',
  '/view/ace-next/labo/2026':       'LABO2026年度'
};

/* ---------- helpers ---------- */
const $ = (s)=>document.querySelector(s);
const fmtInt = (n)=> (Number(n)||0).toLocaleString('ja-JP');
const isoDaysAgo = (n)=>{ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const pretty = (s)=> String(s).replace(/-/g,'/');
const esc = (s)=> String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function splitSM(sm){
  const parts = String(sm||'').split(' / ');
  return { source:(parts[0]||'').toLowerCase(), medium:(parts.slice(1).join(' / ')||'').toLowerCase() };
}
function bucketOf(source, medium){
  for(const r of SOURCE_RULES){ if(r.test(source, medium)) return r; }
  return SOURCE_FALLBACK;
}
const ALL_BUCKETS = [...SOURCE_RULES, SOURCE_FALLBACK];
const bucketMeta = (key)=> ALL_BUCKETS.find(b=>b.key===key) || SOURCE_FALLBACK;
const mdLabel = (s)=>{ s=String(s); return Number(s.slice(4,6))+'/'+Number(s.slice(6,8)); };

// 詳細取得で使う、直近の取得条件（メインの取得成功時に更新）
let LAST = { startDate:'', endDate:'', propertyId:'' };

function deltaHtml(cur, prev){
  cur=Number(cur)||0; prev=Number(prev)||0;
  if(prev===0) return `<span class="delta flat">前期比 —</span>`;
  const pct=(cur-prev)/prev*100;
  const cls = pct>0.05?'up':pct<-0.05?'down':'flat';
  const arrow = pct>0.05?'▲':pct<-0.05?'▼':'—';
  const sign = pct>0?'+':'';
  return `<span class="delta ${cls}">${arrow} ${sign}${pct.toFixed(1)}%<span class="prev">前期比</span></span>`;
}

/* ---------- state ---------- */
function showLoading(){ $('#report').classList.add('hidden'); $('#state').innerHTML='<div class="msg loading"><span class="spin"></span>データを取得しています…</div>'; }
function showError(t){ $('#report').classList.add('hidden'); $('#state').innerHTML=`<div class="msg err"><b>取得できませんでした。</b><br>${t}</div>`; }
function showSetup(){ $('#state').innerHTML=`<div class="msg"><b>初期設定が必要です。</b><br>HTML 内 <code>CONFIG.GAS_URL</code> に、デプロイした GAS ウェブアプリの <code>/exec</code> URL を貼り付けてください。続けて「設定」から GA4 プロパティID を入力し「更新」を押します。</div>`; }
function clearState(){ $('#state').innerHTML=''; }

/* ---------- render: summary ---------- */
function renderSummary(totals){
  const c=totals.current||{}, p=totals.previous||{};
  const defs=[
    {key:'sessions',        label:'訪問数'},
    {key:'totalUsers',      label:'訪問した人数'},
    {key:'screenPageViews', label:'ページ閲覧数'}
  ];
  $('#summaryGrid').innerHTML = defs.map(d=>`
    <div class="cell">
      <div class="label">${d.label}</div>
      <div class="value num">${fmtInt(c[d.key])}</div>
      ${deltaHtml(c[d.key], p[d.key])}
    </div>`).join('');
}

/* ---------- render: channel ---------- */
function renderChannel(channelRows){
  const cur={}, prev={};
  channelRows.forEach(r=>{
    const {source,medium}=splitSM(r.sessionSourceMedium);
    const b=bucketOf(source,medium).key;
    const tgt = r.dateRange==='date_range_1'?prev:cur;
    tgt[b]=(tgt[b]||0)+(Number(r.sessions)||0);
  });
  const total = Object.values(cur).reduce((a,b)=>a+b,0) || 1;
  const rows = ALL_BUCKETS
    .map(b=>({b, cur:cur[b.key]||0, prev:prev[b.key]||0}))
    .filter(x=> x.cur>0 || x.prev>0)
    .sort((a,b)=> b.cur-a.cur);

  $('#chanList').innerHTML = rows.map(x=>{
    const share=(x.cur/total*100);
    return `<div class="chan-row">
      <div class="chan-name"><span class="dot" style="background:${x.b.color}"></span>${esc(x.b.label)}</div>
      <div class="chan-bar"><i style="width:${share.toFixed(1)}%; background:${x.b.color}"></i></div>
      <div class="chan-val">
        <b class="num">${fmtInt(x.cur)}</b><em>${share.toFixed(0)}%</em>
        ${deltaHtml(x.cur, x.prev)}
      </div>
    </div>`;
  }).join('') || '<div class="note">対象期間のデータがありません。</div>';

  $('#chanNote').textContent =
    '「LINE・直接アクセス」には、LINEのリッチメニューやブックマーク等、入口が記録されない訪問が含まれます。';
}

/* ---------- render: pages ---------- */
function renderPages(pagesRows, pageSourceRows){
  // ページ別 閲覧数（当期・前期）
  const cur={}, prev={}, title={};
  pagesRows.forEach(r=>{
    const key=r.pagePath;
    if(!title[key]) title[key]=r.pageTitle;
    const tgt = r.dateRange==='date_range_1'?prev:cur;
    tgt[key]=(tgt[key]||0)+(Number(r.screenPageViews)||0);
  });
  // ページ×入口 の内訳（当期）
  const split={};
  pageSourceRows.forEach(r=>{
    const {source,medium}=splitSM(r.sessionSourceMedium);
    const bk=bucketOf(source,medium).key;
    (split[r.pagePath]=split[r.pagePath]||{});
    split[r.pagePath][bk]=(split[r.pagePath][bk]||0)+(Number(r.screenPageViews)||0);
  });

  const topPaths = Object.keys(cur).sort((a,b)=>cur[b]-cur[a]).slice(0,15);

  // 凡例（実際に出現する入口のみ）
  const usedKeys = new Set();
  topPaths.forEach(p=> Object.keys(split[p]||{}).forEach(k=>usedKeys.add(k)));
  const legendBuckets = ALL_BUCKETS.filter(b=>usedKeys.has(b.key));
  $('#legend').innerHTML = legendBuckets.map(b=>
    `<span><span class="dot" style="background:${b.color}"></span>${esc(b.label)}</span>`).join('');

  $('#pageList').innerHTML = topPaths.map(path=>{
    const name = PAGE_LABELS[path] || cleanTitle(title[path]) || path;
    const sp = split[path]||{};
    const spTotal = Object.values(sp).reduce((a,b)=>a+b,0) || 1;
    const order = ALL_BUCKETS.filter(b=> (sp[b.key]||0)>0).sort((a,b)=> sp[b.key]-sp[a.key]);
    const seg = order.map(b=>`<i style="width:${(sp[b.key]/spTotal*100).toFixed(1)}%; background:${b.color}"></i>`).join('');
    const chips = order.map(b=>`<span class="chip"><span class="dot" style="background:${b.color}"></span>${esc(b.label)}<span class="num">${fmtInt(sp[b.key])}</span></span>`).join('');
    return `<div class="page-item">
      <div class="page-head">
        <div class="page-name">${esc(name)}<span class="page-path">${esc(path)}</span></div>
        <div class="page-metrics"><b class="num">${fmtInt(cur[path])}</b><span class="unit">閲覧</span>${deltaHtml(cur[path],prev[path])}</div>
      </div>
      <div class="stack">${seg}</div>
      <div class="chips">${chips}</div>
    </div>`;
  }).join('') || '<div class="msg" style="border:0">対象期間のデータがありません。</div>';
}
function cleanTitle(t){
  if(!t || t==='(not set)') return '';
  // 「ページ名 | サイト名」「ページ名 - サイト名」形式なら前半だけ採用
  return String(t).split(/\s[|｜]\s|\s-\s/)[0].trim();
}

/* ---------- ページ絞り込み：プルダウン生成 ---------- */
function populatePicker(pagesRows){
  const cur={}, title={};
  pagesRows.forEach(r=>{
    if(r.dateRange==='date_range_1') return; // 当期のみ
    cur[r.pagePath]=(cur[r.pagePath]||0)+(Number(r.screenPageViews)||0);
    if(!title[r.pagePath]) title[r.pagePath]=r.pageTitle;
  });
  const paths=Object.keys(cur).sort((a,b)=>cur[b]-cur[a]);
  const sel=$('#pageSelect');
  sel.innerHTML='<option value="">— ページを選択 —</option>'+paths.map(p=>{
    const name=PAGE_LABELS[p]||cleanTitle(title[p])||p;
    return `<option value="${esc(p)}" data-name="${esc(name)}">${esc(name)}（${fmtInt(cur[p])}）</option>`;
  }).join('');
  sel.value='';
  $('#pageDetail').innerHTML='';
  $('#pageDetailHint').classList.remove('hidden');
}

/* ---------- ページ絞り込み：詳細取得 ---------- */
async function loadPageDetail(path){
  if(!path){ $('#pageDetail').innerHTML=''; $('#pageDetailHint').classList.remove('hidden'); return; }
  $('#pageDetailHint').classList.add('hidden');
  $('#pageDetail').innerHTML='<div class="detail-loading"><span class="spin"></span>ページの詳細を取得しています…</div>';
  try{
    const q=new URLSearchParams({ mode:'pageDetail', page:path, startDate:LAST.startDate, endDate:LAST.endDate, propertyId:LAST.propertyId }).toString();
    const resp=await fetch(CONFIG.GAS_URL+'?'+q);
    if(!resp.ok) throw new Error('サーバー応答エラー（HTTP '+resp.status+'）。');
    const res=await resp.json();
    if(!res||!res.ok) throw new Error((res&&res.error)||'取得に失敗しました。');
    renderPageDetail(res.data, path);
  }catch(err){
    $('#pageDetail').innerHTML=`<div class="msg err" style="margin:16px 20px 20px">${esc(err.message||String(err))}</div>`;
  }
}

/* ---------- ページ絞り込み：詳細描画 ---------- */
function renderPageDetail(d, path){
  const opt=$('#pageSelect').selectedOptions[0];
  const name=(opt&&opt.dataset.name)||PAGE_LABELS[path]||path;
  const c=(d.totals&&d.totals.current)||{}, p=(d.totals&&d.totals.previous)||{};

  const kpis=[
    {key:'screenPageViews', label:'ページ閲覧数'},
    {key:'sessions',        label:'訪問数'},
    {key:'totalUsers',      label:'訪問した人数'}
  ];
  const kpiHtml=kpis.map(k=>`<div class="k"><div class="label">${k.label}</div><div class="value num">${fmtInt(c[k.key])}</div>${deltaHtml(c[k.key],p[k.key])}</div>`).join('');

  // 推移
  const daily=(d.daily||[]).map(r=>({d:r.date, v:Number(r.screenPageViews)||0}));
  const trendHtml = daily.length>=2
    ? sparkline(daily,'#2857D6')
    : `<div class="trend-single num">${fmtInt(daily.length?daily[0].v:(c.screenPageViews||0))}<span style="font-size:13px;color:var(--muted);font-weight:500"> 閲覧</span></div>`;

  // 入口内訳（当期・前期）
  const cur={}, prev={};
  (d.source||[]).forEach(r=>{
    const {source,medium}=splitSM(r.sessionSourceMedium);
    const bk=bucketOf(source,medium).key;
    const tgt=r.dateRange==='date_range_1'?prev:cur;
    tgt[bk]=(tgt[bk]||0)+(Number(r.screenPageViews)||0);
  });
  const total=Object.values(cur).reduce((a,b)=>a+b,0)||1;
  const srcRows=ALL_BUCKETS.map(b=>({b, cur:cur[b.key]||0, prev:prev[b.key]||0}))
    .filter(x=>x.cur>0||x.prev>0).sort((a,b)=>b.cur-a.cur)
    .map(x=>{
      const share=x.cur/total*100;
      return `<div class="chan-row">
        <div class="chan-name"><span class="dot" style="background:${x.b.color}"></span>${esc(x.b.label)}</div>
        <div class="chan-bar"><i style="width:${share.toFixed(1)}%;background:${x.b.color}"></i></div>
        <div class="chan-val"><b class="num">${fmtInt(x.cur)}</b><em>${share.toFixed(0)}%</em>${deltaHtml(x.cur,x.prev)}</div>
      </div>`;
    }).join('') || '<div class="note" style="padding-left:0">入口のデータがありません。</div>';

  $('#pageDetail').innerHTML=`<div class="detail">
    <p class="detail-title">${esc(name)}<span class="page-path">${esc(path)}</span></p>
    <div class="detail-kpi">${kpiHtml}</div>
    <div class="detail-sub">閲覧数の推移</div>
    ${trendHtml}
    <div class="detail-sub">入口の内訳</div>
    <div class="chan" style="padding:0">${srcRows}</div>
  </div>`;
}

/* ---------- 軽量スパークライン（SVG・依存なし） ---------- */
function sparkline(data, color){
  const W=680, H=170, padL=8, padR=8, padT=16, padB=22;
  const n=data.length;
  const max=Math.max(1, ...data.map(d=>d.v));
  const iw=W-padL-padR, ih=H-padT-padB;
  const x=i=> padL + (n<=1?iw/2 : iw*i/(n-1));
  const y=v=> padT + ih - (v/max*ih);
  const pts=data.map((d,i)=>[x(i),y(d.v)]);
  const line=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
  const area=`${line} L ${x(n-1).toFixed(1)} ${(padT+ih).toFixed(1)} L ${x(0).toFixed(1)} ${(padT+ih).toFixed(1)} Z`;
  const idxs = n<=2?[0,n-1]:[0, Math.floor((n-1)/2), n-1];
  const xlab = idxs.map(i=>{
    const anchor = i===0?'start':i===n-1?'end':'middle';
    return `<text x="${x(i).toFixed(1)}" y="${H-6}" font-size="10" fill="#9AA4B0" text-anchor="${anchor}">${mdLabel(data[i].d)}</text>`;
  }).join('');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="閲覧数の推移">
    <line x1="${padL}" y1="${padT}" x2="${W-padR}" y2="${padT}" stroke="#EEF1F5"/>
    <text x="${W-padR}" y="${padT-5}" font-size="10" fill="#9AA4B0" text-anchor="end">${fmtInt(max)}</text>
    <path d="${area}" fill="${color}" fill-opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${xlab}
  </svg>`;
}

/* ---------- main ---------- */
async function load(){
  if(!CONFIG.GAS_URL || CONFIG.GAS_URL.startsWith('PASTE_')){ showSetup(); return; }
  const startDate=$('#start').value, endDate=$('#end').value;
  if(!startDate||!endDate){ showError('開始日と終了日を指定してください。'); return; }
  if(startDate>endDate){ showError('開始日が終了日より後になっています。'); return; }
  const propertyId=($('#propId').value||CONFIG.DEFAULT_PROPERTY_ID||'').replace(/\D/g,'');

  $('#run').disabled=true; showLoading();
  try{
    const q=new URLSearchParams({startDate,endDate,propertyId}).toString();
    const resp=await fetch(CONFIG.GAS_URL+'?'+q);
    if(!resp.ok) throw new Error('サーバー応答エラー（HTTP '+resp.status+'）。GAS の公開設定を確認してください。');
    const res=await resp.json();
    if(!res||!res.ok) throw new Error((res&&res.error)||'不明なエラーが発生しました。');
    const d=res.data;

    const label=($('#propLabel').value||CONFIG.PROPERTY_LABEL||`GA4 プロパティ ${d.meta.propertyId}`);
    $('#subline').innerHTML=`<b>${esc(label)}</b>　${pretty(d.meta.startDate)}〜${pretty(d.meta.endDate)}`+
      `<span style="color:var(--faint)">（前期比：${pretty(d.meta.prevStartDate)}〜${pretty(d.meta.prevEndDate)}）</span>`;
    renderSummary(d.totals);
    renderChannel(d.channel||[]);
    renderPages(d.pages||[], d.pageSource||[]);
    LAST={ startDate:d.meta.startDate, endDate:d.meta.endDate, propertyId:d.meta.propertyId };
    populatePicker(d.pages||[]);
    $('#updated').textContent='取得日時：'+new Date().toLocaleString('ja-JP');
    clearState(); $('#report').classList.remove('hidden');
  }catch(err){
    showError(esc(err.message||String(err)));
  }finally{
    $('#run').disabled=false;
  }
}

/* ---------- controls ---------- */
function setPreset(days){
  $('#end').value=isoDaysAgo(1); $('#start').value=isoDaysAgo(days);
  document.querySelectorAll('#presets button').forEach(b=> b.setAttribute('aria-pressed', String(Number(b.dataset.days)===days)));
}
$('#presets').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; setPreset(Number(b.dataset.days)); load(); });
['#start','#end'].forEach(sel=> $(sel).addEventListener('change',()=> document.querySelectorAll('#presets button').forEach(b=>b.setAttribute('aria-pressed','false'))));
$('#run').addEventListener('click', load);
$('#pageSelect').addEventListener('change', e=> loadPageDetail(e.target.value));
$('#print').addEventListener('click', ()=> window.print());
$('#propId').value=CONFIG.DEFAULT_PROPERTY_ID||'';
$('#propLabel').value=CONFIG.PROPERTY_LABEL||'';

setPreset(28); load();
</script>
